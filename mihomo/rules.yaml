# --- Sniffer ---
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]

# ============================================================
# Rule Providers
# ============================================================
rule-providers:
  # itdog — GeoBlock (заблокированные в РФ домены)
  itdog-geoblock:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/itdoginfo/allow-domains/releases/download/2026-11-09_19-01/geoblock_domain.mrs"
    path: ./ruleset/itdog-geoblock.mrs
    interval: 86400
    proxy: PROXY

  # Можно добавить ещё от itdog при желании:
  # itdog-russia-inside:
  #   type: http
  #   behavior: domain
  #   format: mrs
  #   url: "https://github.com/itdoginfo/allow-domains/raw/main/MRS/russia-inside_domain.mrs"
  #   path: ./ruleset/itdog-russia-inside.mrs
  #   interval: 86400

# ============================================================
# Proxy Groups (минимальный набор — подставь свои ноды)
# ============================================================
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - 🚀 Auto
      - DIRECT
      # сюда подставятся ноды из подписки

  - name: 🚀 Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      # сюда подставятся ноды из подписки

  - name: 🛑 REJECT
    type: select
    proxies:
      - REJECT
      - REJECT-DROP

# ============================================================
# Rules
# ============================================================
rules:

  # ----------------------------------------------------------
  # 0. Защита от петель и спец. правила (со скрина)
  # ----------------------------------------------------------
  - IP-CIDR,127.0.0.0/8,REJECT,no-resolve
  - IP-CIDR,0.0.0.0/32,REJECT,no-resolve
  - IP-CIDR6,::1/128,REJECT,no-resolve
  - IP-CIDR6,::/128,REJECT,no-resolve

  # Блокировка QUIC (UDP 443) — часто помогает с обходами
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP

  # Блокировка STUN (часто используется для WebRTC leak)
  - AND,((NETWORK,UDP),(DST-PORT,3478)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,3479)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,19302)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,19303)),REJECT-DROP

  # DNS over TLS
  - DST-PORT,853,REJECT

  # ----------------------------------------------------------
  # 1. Локальная сеть
  # ----------------------------------------------------------
  - GEOSITE,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve

  # ----------------------------------------------------------
  # 2. PROCESS-NAME (высокий приоритет)
  # ----------------------------------------------------------

  # 🖥️ app>proxy (примеры — дополни своими)
  - PROCESS-NAME,anydesk.exe,PROXY
  - PROCESS-NAME,ExampleApp.exe,PROXY

